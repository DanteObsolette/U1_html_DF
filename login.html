<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Club Deportivo</title>
    
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="page-login">

    <header>
        <a href="index.html"><img src="logo.PNG.png" alt="SportClub logo"></a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="#">Planes</a>
            <a href="#">Reservas</a>
        </nav>
    </header>

    <main>
        <section id="login">
            <h2>Iniciar Sesión</h2>
            <p class="form-hint">Credenciales de prueba (seed): <code>user1@demo.cl</code> / <code>12345678</code> · <code>coach1@demo.cl</code> · <code>admin1@demo.cl</code> (misma contraseña). Requiere API en <code id="api-base-hint">http://localhost:3000</code>.</p>
            <form id="login-form" novalidate>
                <label for="email">Correo:</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu correo" autocomplete="username" required>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                <button type="submit">Ingresar</button>
            </form>
            <p id="login-error" class="login-error" role="alert" hidden></p>
            <div style="text-align: center; margin-top: 16px;">
                <p><a href="recuperar.html">Recuperar contraseña</a></p>
                <p><a href="registro.html">Registrarse</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Club Deportivo</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        initLoginPage();
    </script>
</body>
</html>
