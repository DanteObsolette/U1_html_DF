<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Club Deportivo Pro</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="page-register">

    <header>
        <a href="index.html"><img src="logo.PNG.png" alt="SportClub logo"></a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <section id="registro">
            <h2>Registro de Usuario</h2>
            <p class="form-hint">Se registrará con rol <strong>Usuario</strong> mediante <code>POST /api/auth/register</code>.</p>

            <form id="register-form" novalidate>
                <label for="full_name">Nombre completo</label>
                <input type="text" id="full_name" name="full_name" placeholder="Nombre y apellido" required minlength="3" maxlength="150" autocomplete="name">
                <p class="field-error" id="err-full_name" data-field-error></p>

                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="correo@sportclub.cl" required maxlength="150" autocomplete="email">
                <p class="field-error" id="err-email" data-field-error></p>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres, letra y número" required minlength="8" autocomplete="new-password">
                <p class="field-error" id="err-password" data-field-error></p>

                <label for="confirm_password">Confirmar contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repita la contraseña" required autocomplete="new-password">
                <p class="field-error" id="err-confirm_password" data-field-error></p>

                <label for="birth_date">Fecha de nacimiento (opcional)</label>
                <input type="date" id="birth_date" name="birth_date">
                <p class="field-error" id="err-birth_date" data-field-error></p>

                <button type="submit">Registrarse</button>
            </form>

            <p id="register-error" class="login-error" role="alert" hidden></p>
            <p id="register-success" class="form-success" role="status" hidden></p>
            <p class="form-footer-link"><a href="login.html">¿Ya tiene cuenta? Inicie sesión</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Club Deportivo</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/register-page.js"></script>
    <script>
        initRegisterPage();
    </script>
</body>
</html>
