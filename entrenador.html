<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Entrenador - SportClub</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="page-coach">
    <header>
        <a href="index.html"><img src="logo.PNG.png" alt="SportClub logo"></a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Mi perfil</a>
            <a href="#">Mis Alumnos</a>
            <a href="#">Mi Horario</a>
            <a href="#">Reportes</a>
            <button type="button" id="btn-logout">Cerrar Sesión</button>
        </nav>
    </header>
    <main>
        <h2>Dashboard Coach</h2>
        <p class="dashboard-welcome">Sesión iniciada como: <strong id="user-display-name"></strong> (<span id="user-display-email"></span>)</p>
        <section class="dashboard-panel">
            <div class="panel">
                <h3>Mis alumnos</h3>
                <p>Alumno 1 - Email</p>
                <p>Alumno 2 - Email</p>
                <p>Alumno 3 - Email</p>

            <div class="panel">
                <h3>Mi Horario</h3>
                <p>Lunes - Spinning 18:00</p>
                <p>Miércoles - Boxeo 11:00</p>
                <p>Viernes - CrossFit 10:00</p>
            </div>
            <div class="panel">
                <h3>Reportes</h3>
                <p>Ver detalles de progreso</p>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 SportClub</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        protectDashboard("coach");
    </script>
</body>
</html>
